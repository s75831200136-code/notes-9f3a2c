<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電腦常識測驗 · 互動題庫練習（116 九升十）</title>
<style>
:root{
  --navy:#1a3a5c; --navy2:#24507a; --red:#c53030; --gold:#c9a227;
  --green:#2f855a; --cream:#faf7f2; --card:#ffffff; --line:#e3dccf;
  --ink:#22303c; --muted:#6b7684;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Microsoft JhengHei","PingFang TC","Heiti TC",system-ui,sans-serif;
  background:var(--cream); color:var(--ink); font-size:16.5px; line-height:1.7;
  -webkit-text-size-adjust:100%;
}
header{
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:#fff; padding:22px 20px 18px; position:sticky; top:0; z-index:40;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.h-wrap{max-width:920px;margin:0 auto}
.badge{display:inline-block;background:var(--gold);color:#3a2c00;font-weight:700;
  font-size:12.5px;letter-spacing:1px;padding:3px 10px;border-radius:20px;margin-bottom:8px}
h1{margin:0;font-size:23px;font-weight:800;letter-spacing:.5px}
.sub{margin:4px 0 0;font-size:13.5px;color:#d9e4f0;opacity:.95}
.stats{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
  border-radius:10px;padding:6px 12px;font-size:13px;min-width:76px}
.stat b{display:block;font-size:19px;font-weight:800;line-height:1.2}
.stat.correct b{color:#9be6bd} .stat.wrong b{color:#ffb4b0} .stat.rate b{color:var(--gold)}

main{max-width:920px;margin:0 auto;padding:16px 16px 60px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 16px 14px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.panel h2{margin:0 0 10px;font-size:15px;color:var(--navy);font-weight:800;
  border-left:4px solid var(--gold);padding-left:9px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:center}
.row .lbl{font-size:13px;color:var(--muted);min-width:56px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);
  padding:5px 12px;border-radius:20px;font-size:13.5px;cursor:pointer;user-select:none;
  transition:.12s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.sm{padding:4px 10px;font-size:12.5px}
select,.btn{font-family:inherit}
.btn{background:var(--navy);color:#fff;border:none;border-radius:10px;
  padding:9px 16px;font-size:14.5px;font-weight:700;cursor:pointer;transition:.12s}
.btn:hover{background:var(--navy2)}
.btn.gold{background:var(--gold);color:#3a2c00}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.startbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}

/* progress */
.progress{height:8px;background:#eee4d4;border-radius:6px;overflow:hidden;margin:2px 0 14px}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e0be47);width:0;transition:.3s}

/* question card */
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.qmeta{font-size:12.5px;color:var(--muted)}
.qtag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:12px;margin-right:6px}
.qtag.single{background:#e7eff7;color:var(--navy)}
.qtag.multi{background:#fbeaea;color:var(--red)}
.qtag.sec{background:#f3ecd8;color:#7a5c00}
.star{cursor:pointer;font-size:20px;color:#cfc6b3;line-height:1;user-select:none}
.star.on{color:var(--gold)}
.qstem{font-size:18px;font-weight:700;color:var(--navy);margin:6px 0 14px;line-height:1.6}
.qstem .num{color:var(--gold);font-weight:800;margin-right:6px}

.opt{display:flex;gap:11px;align-items:flex-start;border:1.6px solid var(--line);
  background:#fff;border-radius:11px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--gold);background:#fffdf6}
.opt .mk{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid #c7bfae;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13.5px;color:var(--navy)}
.opt.multi .mk{border-radius:7px}
.opt.sel{border-color:var(--navy);background:#f2f7fc}
.opt.sel .mk{background:var(--navy);color:#fff;border-color:var(--navy)}
.opt .ot{flex:1;font-size:15.5px;line-height:1.6}
.opt.correct{border-color:var(--green);background:#eefaf2}
.opt.correct .mk{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{border-color:var(--red);background:#fdecec}
.opt.wrong .mk{background:var(--red);color:#fff;border-color:var(--red)}
.opt.locked{cursor:default}
.opt.locked:hover{background:inherit}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.nav-spacer{flex:1}

/* explanation */
.explain{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:none}
.explain.show{display:block}
.explain .bar{padding:8px 14px;font-weight:800;font-size:14.5px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.explain.ok .bar{background:var(--green)}
.explain.no .bar{background:var(--red)}
.explain .body{background:#fbf8f1;padding:13px 15px;font-size:15px;line-height:1.75}
.explain .ans{font-weight:800;color:var(--navy)}
.explain .body .lead{display:inline-block;background:var(--navy);color:#fff;font-size:12px;
  padding:1px 8px;border-radius:10px;margin-right:8px;font-weight:700}

.empty{text-align:center;color:var(--muted);padding:40px 10px}
.done{text-align:center;padding:30px 12px}
.done h3{color:var(--navy);font-size:22px;margin:.2em 0}
.done .big{font-size:44px;font-weight:800;color:var(--gold)}
.footnote{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.7}
.kbd{background:#efe9dc;border:1px solid #ddd3bf;border-radius:5px;padding:0 6px;font-size:12px;font-family:monospace}
@media (max-width:720px){
  body{font-size:16px}
  h1{font-size:19px}
  .qstem{font-size:16.5px}
  .opt .ot{font-size:15px}
  .stat{min-width:64px;padding:5px 9px}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<header>
  <div class="h-wrap">
    <span class="badge">116 · 九升十職等 · 電腦常識</span>
    <h1>電腦常識測驗 — 互動題庫練習</h1>
    <p class="sub">共 340 題（資訊卷 240＋資安卷 100）　·　單選 215／複選 125　·　選項自動打亂，附解說</p>
    <div class="stats">
      <div class="stat"><b id="st-done">0</b>已作答</div>
      <div class="stat correct"><b id="st-ok">0</b>答對</div>
      <div class="stat wrong"><b id="st-no">0</b>答錯</div>
      <div class="stat rate"><b id="st-rate">—</b>正確率</div>
      <div class="stat"><b id="st-pos">0/0</b>進度</div>
    </div>
  </div>
</header>

<main>
  <!-- Setup panel -->
  <div class="panel" id="setup">
    <h2>練習設定</h2>
    <div class="row">
      <span class="lbl">題型</span>
      <span class="chip on" data-type="all">全部</span>
      <span class="chip" data-type="single">單選</span>
      <span class="chip" data-type="multi">複選</span>
    </div>
    <div class="row">
      <span class="lbl">範圍</span>
      <span class="chip on" data-scope="all">全部題目</span>
      <span class="chip" data-scope="wrong">只練錯題</span>
      <span class="chip" data-scope="star">只練標記</span>
    </div>
    <div class="row">
      <span class="lbl">出題</span>
      <span class="chip on" data-order="shuffle">隨機洗題</span>
      <span class="chip" data-order="seq">依序</span>
      <span class="chip on" data-optshuffle="1" id="optShufChip">選項打亂：開</span>
    </div>
    <div class="row" id="secRow">
      <span class="lbl">主題</span>
      <span class="chip sm on" data-sec="__all">全部主題</span>
    </div>
    <div class="startbar">
      <button class="btn gold" id="btnStart">開始練習 ▶</button>
      <button class="btn ghost" id="btnResetStats">清除作答紀錄</button>
    </div>
    <div class="footnote" style="text-align:left;margin-top:12px">
      快捷鍵：<span class="kbd">1</span>~<span class="kbd">5</span> 選項　<span class="kbd">Enter</span> 送出／下一題　<span class="kbd">←</span> <span class="kbd">→</span> 上下題　<span class="kbd">S</span> 標記
    </div>
  </div>

  <!-- Quiz area -->
  <div id="quiz" style="display:none">
    <div class="progress"><i id="pbar"></i></div>
    <div class="panel" id="qcard"></div>
  </div>
</main>

<script>
// 116年度九職等人員晉升十職等人員題庫 —「電腦常識」
// 本檔含兩卷：卷一(資訊) 單選 S1-S155 + 複選 M1-M85；卷二(資訊安全) 單選 SB1-SB60 + 複選 MB1-MB40
const QUESTIONS = [
{
  id:"S1", type:"single", sec:"企業資訊系統",
  q:"企業購買「個人電腦」的準則包括：",
  opts:[
    {k:"A", t:"作業系統的考量。"},
    {k:"B", t:"連結性。"},
    {k:"C", t:"物超所值的績效表現。"},
    {k:"D", t:"以上皆是。", pin:true}
  ],
  ans:["D"],
  exp:"採購 PC 須同時考量軟體相容(作業系統)、能否連上網路與周邊(連結性)、以及價格與效能比，三者缺一不可，故以上皆是。單選整卷凡出現「以上皆是」且各選項彼此不衝突時，多為正解。"
},
{
  id:"S2", type:"single", sec:"企業資訊系統",
  q:"下列何者是「跨功能」企業系統？",
  opts:[
    {k:"A", t:"許多公司使用資訊系統開發整合式的「跨功能」企業系統，以打破傳統企業功能疆界、進行流程再造並改善關鍵企業程序。"},
    {k:"B", t:"公司將「跨功能」企業系統視為策略應用，用以分享資訊資源、提升企業流程的效率與效能。"},
    {k:"C", t:"公司將「跨功能」企業系統視為策略應用，用以在客戶、供應商與夥伴間發展策略合作關係。"},
    {k:"D", t:"以上皆是。", pin:true}
  ],
  ans:["D"],
  exp:"跨功能(cross-functional)系統的目的就是跨越部門疆界、整合流程並支援對內對外的策略協作，三種描述都是其面向，故選以上皆是。重點：跨功能系統＝打破部門本位、串起端到端流程。"
},
{
  id:"S3", type:"single", sec:"企業資訊系統",
  q:"實施新的「企業資源規劃(ERP)系統」，以下哪項是所需成本的最大部分？",
  opts:[
    {k:"A", t:"硬體成本。"},
    {k:"B", t:"軟體費用。"},
    {k:"C", t:"流程再造與培訓。"},
    {k:"D", t:"從老舊系統資料轉換。"},
  ],
  ans:["C"],
  exp:"ERP 導入最貴的往往不是軟硬體，而是配合系統重整組織流程(流程再造)與大量人員教育訓練所耗的時間與人力。好記：ERP 導入「人與流程」比「機器」更燒錢。"
},
{
  id:"S4", type:"single", sec:"網路與通訊",
  q:"在電信通訊架構中，何謂「通訊協定(protocol)」？",
  opts:[
    {k:"A", t:"在區域網路上，處理與交換語音及資料的設備。"},
    {k:"B", t:"在電信通訊網路上，最主要的電腦。"},
    {k:"C", t:"為微電腦使用者提供的通訊服務。"},
    {k:"D", t:"控制網路通訊的一套標準規則與程序。"},
  ],
  ans:["D"],
  exp:"通訊協定是雙方溝通所遵循的一套標準規則與程序(如 TCP/IP、HTTP)，A、B 講的是設備或主機而非規則。好記：protocol＝通訊的「交通規則」。"
},
{
  id:"S5", type:"single", sec:"雲端與新興科技",
  q:"下列哪項不是雲端運算的特點？",
  opts:[
    {k:"A", t:"快速擴展。"},
    {k:"B", t:"可靠性。"},
    {k:"C", t:"高成本。"},
    {k:"D", t:"資源共享。"},
  ],
  ans:["C"],
  exp:"雲端強調彈性擴展、資源共享與依用量付費，反而是「降低」自建機房的高固定成本，故「高成本」不是其特點。好記：雲端賣點是彈性與省成本。"
},
{
  id:"S6", type:"single", sec:"金融科技與數位金融",
  q:"關於晶片金融卡，下列敘述何者正確？",
  opts:[
    {k:"A", t:"晶片卡密碼交易時經由特殊管道傳送至銀行確認即足以確認本人交易。"},
    {k:"B", t:"晶片金融卡正面或反面插入一般讀卡機皆可使用。"},
    {k:"C", t:"客戶變更密碼後的密碼儲存於晶片內，銀行無法得知。"},
    {k:"D", t:"整張卡具備複雜電路，即使晶片或保護膜些微刮損整張卡即無法使用，需妥善保護。"},
  ],
  ans:["C"],
  exp:"晶片卡採卡內驗證，變更後的密碼儲存於晶片而不回傳銀行，故銀行無法得知(C 正確)。B 錯在晶片有方向性、須正確插入；D 過度誇大，輕微刮損未必報廢。好記：晶片卡密碼「藏在卡裡」。"
},
{
  id:"S7", type:"single", sec:"金融科技與數位金融",
  q:"「電子商務」包括？",
  opts:[
    {k:"A", t:"利用企業外部網路(Extranet)存取客戶與供應商型錄資料庫的電子商務流程。"},
    {k:"B", t:"業務與客服人員利用企業內部網路(Intranet)存取「顧客關係管理」系統。"},
    {k:"C", t:"透過電子郵件交流，讓客戶共同參與產品開發。"},
    {k:"D", t:"以上皆是。", pin:true}
  ],
  ans:["D"],
  exp:"電子商務涵蓋對供應商/客戶(B2B、B2C)、內部作業支援與客戶協同開發等各種以網路進行的商業活動，三者皆屬之。好記：凡以網路完成商業交易或協作，皆算電子商務。"
},
{
  id:"S8", type:"single", sec:"金融科技與數位金融",
  q:"「舊客戶獎勵，如折價券、折扣、個別優惠或其他網路服務」屬於電子商務成功要素中何者的敘述？",
  opts:[
    {k:"A", t:"效能與服務。"},
    {k:"B", t:"選擇與價值。"},
    {k:"C", t:"廣告與誘因。"},
    {k:"D", t:"網站外觀與感覺。"},
  ],
  ans:["C"],
  exp:"折價券、折扣、優惠都是吸引與留住顧客的「誘因(incentive)」，搭配廣告曝光，屬「廣告與誘因」要素。好記：給好康＝誘因。"
},
{
  id:"S9", type:"single", sec:"企業資訊系統",
  q:"「人機互動」之所以困難重重，主要原因在於？",
  opts:[
    {k:"A", t:"面對電腦機器的陌生感。"},
    {k:"B", t:"以人為中心。"},
    {k:"C", t:"使用者能在學習後很快熟悉其他系統的操作。"},
    {k:"D", t:"以上皆是。", pin:true}
  ],
  ans:["A"],
  exp:"人機互動困難主因在使用者對機器介面的陌生與學習門檻，B、C 反而是有利因素或設計目標，故選 A。好記：介面難用＝使用者感到陌生、不直覺。"
},
{
  id:"S10", type:"single", sec:"企業資訊系統",
  q:"「整合性」報表在 MIS(管理資訊系統)上，可分成哪些報表？",
  opts:[
    {k:"A", t:"彙報分析。"},
    {k:"B", t:"作業程序。"},
    {k:"C", t:"決策分析。"},
    {k:"D", t:"以上皆是。", pin:true}
  ],
  ans:["B"],
  exp:"本題依原卷答案為 B(作業程序)。MIS 報表用以支援日常作業程序的執行與控管。※原卷此題選項與答案對應較不直觀，照原卷作答。"
},
{
  id:"S11", type:"single", sec:"企業資訊系統",
  q:"下列何者是「資訊(information)」的特性重點？",
  opts:[
    {k:"A", t:"未經整理。"},
    {k:"B", t:"有用的。"},
    {k:"C", t:"原始的。"},
    {k:"D", t:"以上皆非。", pin:true}
  ],
  ans:["B"],
  exp:"「資料(data)」是未經整理的原始素材，經處理後對決策「有用」才稱為「資訊」，故 B 正確、A、C 描述的是資料。好記：資料→加工→有用的資訊。"
},
{
  id:"S12", type:"single", sec:"資料庫",
  q:"下列何者是「資料庫系統」的評估「效益」項目？",
  opts:[
    {k:"A", t:"資料流程圖。"},
    {k:"B", t:"資料的來源無法做到一致性。"},
    {k:"C", t:"程式編碼。"},
    {k:"D", t:"以上皆是。", pin:true}
  ],
  ans:["B"],
  exp:"本題依原卷答案為 B。資料庫系統的重要效益之一即在改善資料一致性問題，故以此為評估切入點。※原卷選項敘述略為突兀，照原卷作答。"
},
{
  id:"S13", type:"single", sec:"企業資訊系統",
  q:"一般「資訊整合」平台包含哪些？",
  opts:[
    {k:"A", t:"應用程式整合。"},
    {k:"B", t:"商業流程整合。"},
    {k:"C", t:"社群平台整合。"},
    {k:"D", t:"以上皆是。", pin:true}
  ],
  ans:["D"],
  exp:"資訊整合平台須串接應用程式(AP)、商業流程(BPM)與外部社群等多種資源，三者皆屬整合範疇。好記：整合平台＝把散落的系統與流程接起來。"
},
{
  id:"S14", type:"single", sec:"企業資訊系統",
  q:"「資訊策略」和「企業策略」的關係是什麼？",
  opts:[
    {k:"A", t:"沒有關係。"},
    {k:"B", t:"結合對應關係。"},
    {k:"C", t:"上下關係。"},
    {k:"D", t:"以上皆非。", pin:true}

  exp:"容量管理著重更新/生命週期、備援冗餘與單點故障評估(A、B、C)；「設定安全強化標準」屬組態安全(Hardening)而非容量管理範疇。好記：容量管理看更新、備援、單點故障。參見卷一單129。"
},
{
  id:"MB32", type:"multi", sec:"資安治理與內規",
  q:"【資安卷】以下何者為本行海外分行應列入每月業報中報告項目？",
  opts:[
    {k:"A", t:"各項資訊管理報表檢核辦理情形。"},
    {k:"B", t:"誤中社交工程郵件比例。"},
    {k:"C", t:"Highly Visible Cyber Events or Regulatory Alerts。"},
    {k:"D", t:"弱點掃描結果與修補情形。"},
  ],
  ans:["A","C","D"],
  exp:"依原卷答案為 A、C、D，涵蓋管理報表檢核、重大資安/法規警示與弱點修補情形。※原卷未將社交工程誤中率(B)列入每月業報項目，照原卷作答。"

{
  id:"MB33", type:"multi", sec:"資安治理與內規",
  q:"【資安卷】關於帳號管理，哪些行為符合政府頒佈之「資通安全防護基準」規範？",
  opts:[

    {k:"B", t:"避免多人共用同一帳號。"},
    {k:"C", t:"共用帳號時須有更換密碼或代登入機制等補強措施。"},
    {k:"D", t:"共用帳號無須記錄是誰在使用。"},
  ],
  ans:["A","B","C"],
  exp:"帳號應一人一號、避免共用，若不得不共用須有補強措施(A、B、C)；共用帳號更要記錄實際使用者以利追蹤，故 D 錯。好記：帳號一人一號、共用也要留紀錄。參見卷一單151。"
},
{
  id:"MB34", type:"multi", sec:"資安治理與內規",
  q:"【資安卷】金融機構針對 DDoS(分散式阻斷服務)攻擊應採取哪些防護措施？",
  opts:[
    {k:"A", t:"建立 DDoS 監控機制。"},
    {k:"B", t:"建立事故應變機制。"},
    {k:"C", t:"每年進行程序演練或實際演練。"},
    {k:"D", t:"導入硬碟加密機制預防資料外洩。"},
  ],
  ans:["A","B","C"],
  exp:"防 DDoS 靠監控、應變機制與定期演練(A、B、C)；硬碟加密是防資料外洩，與抵禦流量攻擊無關，故 D 非。好記：防 DDoS＝監控＋應變＋演練，跟加密無關。參見卷一單92。"
},
{
  id:"MB35", type:"multi", sec:"資安治理與內規",
  q:"【資安卷】關於資料中心消防系統，下列哪些正確？",
  opts:[
    {k:"A", t:"乾式管路可降低漏水損壞設備風險。"},
    {k:"B", t:"應使用氣體滅火系統。"},
    {k:"C", t:"應使用泡沫滅火系統。"},
    {k:"D", t:"應具備火警自動通報。"},
  ],
  ans:["A","B","D"],
  exp:"機房宜用乾式管路降低漏水風險、採氣體滅火(不損設備)並具火警自動通報;泡沫會損壞電子設備，故 C 非。好記：機房滅火用氣體、不用水/泡沫。參見卷一複77。"
},
{
  id:"MB36", type:"multi", sec:"資訊安全",
  q:"【資安卷】數位憑證授權機構(CA)的職責包含？",
  opts:[
    {k:"A", t:"驗證申請者身分。"},
    {k:"B", t:"幫客戶保管私鑰。"},
    {k:"C", t:"維護憑證撤銷清單。"},
    {k:"D", t:"簽發憑證。"},
  ],
  ans:["A","C","D"],
  exp:"CA 負責審驗身分、簽發憑證與維護撤銷清單(CRL)；私鑰須由持有者自行保管，CA 不得代管，否則喪失不可否認性，故 B 非。好記：CA 發憑證但不碰你的私鑰。參見卷一複47。"
},
{
  id:"MB37", type:"multi", sec:"資訊安全",
  q:"【資安卷】某銀行欲事前防範客戶資料未經授權攜出，下列哪些措施最有效？",
  opts:[
    {k:"A", t:"建立 DLP(資料外洩防範)機制。"},
    {k:"B", t:"建立 USB 儲存裝置管制。"},
    {k:"C", t:"建立使用者個資查詢軌跡。"},
    {k:"D", t:"開啟伺服器日誌供留存稽查。"},
  ],
  ans:["A","B"],
  exp:"DLP 與 USB 管制屬「事前預防」，能直接阻止資料被攜出(A、B)；查詢軌跡與伺服器日誌屬事後偵測/稽核，非事前防範，故 C、D 非。好記：預防攜出靠 DLP＋管 USB，日誌是事後追。"
},
{
  id:"MB38", type:"multi", sec:"資安治理與內規",
  q:"【資安卷】執行業務衝擊分析(BIA)以支援 BCP 與 DRP 時，下列哪些項目或步驟是經常被查核的？",
  opts:[
    {k:"A", t:"RTO 必須大於或等於 MTPD(最大容忍中斷時間)，才能確保災難時於目標時間內完成復原。"},
    {k:"B", t:"BIA 的首要任務是技術系統的細部修復成本評估，對業務損失與合規衝擊的評估則列為次要。"},
    {k:"C", t:"應識別並評估營運中斷對組織造成的財務衝擊、聲譽損失、法律責任及監管合規影響。"},
    {k:"D", t:"RPO(復原點目標)決定了組織在發生中斷事件時，可接受的最大資料遺失量或時間範圍。"},
  ],
  ans:["C","D"],
  exp:"BIA 應評估中斷的財務/聲譽/法律衝擊(C)，RPO 定義可容忍的資料遺失(D)；RTO 應「小於或等於」MTPD(A 錯)、BIA 首重業務衝擊而非技術修復成本(B 錯)。好記：RTO≦MTPD；BIA 看業務衝擊。參見卷一單148。"
},
{
  id:"MB39", type:"multi", sec:"雲端與新興科技",
  q:"【資安卷】雲端 PaaS(平台即服務)模型中，該平台服務提供廠商負責哪些部分？",
  opts:[
    {k:"A", t:"應用程式弱點修補。"},
    {k:"B", t:"作業系統維護。"},
    {k:"C", t:"虛擬化平台管理。"},
    {k:"D", t:"實體環境安全。"},
  ],
  ans:["B","C","D"],
  exp:"PaaS 下業者負責作業系統、虛擬化平台與實體環境；客戶自建的「應用程式」及其弱點修補仍由客戶負責，故 A 非業者責任。好記：PaaS 業者顧到 OS 與平台，App 歸客戶。參見單SB56。"
},
{
  id:"MB40", type:"multi", sec:"資安治理與內規",
  q:"【資安卷】以下何者為金管會近年公告之金融資安政策？",
  opts:[
    {k:"A", t:"金融資安行動方案。"},
    {k:"B", t:"個人資料保護法。"},
    {k:"C", t:"金融資安韌性發展藍圖。"},
    {k:"D", t:"資通安全管理法。"},
  ],
  ans:["A","C"],
  exp:"金管會公告的金融資安政策包含「金融資安行動方案」與「金融資安韌性發展藍圖」；個資法與資通安全管理法是法律(由立法院制定)，非金管會的金融資安政策，故 B、D 非。好記：方案/藍圖＝金管會政策，法＝立法。"
}
];

</script>
<script>
(function(){
  "use strict";
  const LS_KEY="mega_deposit_quiz_v1";
  const $=s=>document.querySelector(s);
  const state={
    type:"all", scope:"all", order:"shuffle", optshuffle:true, sec:"__all",
    list:[], idx:0, answered:{}, // answered[id]=true
  };
  // persistent store
  let store=load();
  function load(){ try{return JSON.parse(localStorage.getItem(LS_KEY))||{}}catch(e){return {}} }
  function save(){ localStorage.setItem(LS_KEY, JSON.stringify(store)); }
  store.wrong = store.wrong||{};   // id: true
  store.star  = store.star ||{};   // id: true
  store.stat  = store.stat ||{done:0,ok:0,no:0};

  // ---- build section chips ----
  const secs=[...new Set(QUESTIONS.map(q=>q.sec))];
  const secRow=$("#secRow");
  secs.forEach(sc=>{
    const c=document.createElement("span");
    c.className="chip sm"; c.dataset.sec=sc;
    c.textContent=sc+"("+QUESTIONS.filter(q=>q.sec===sc).length+")";
    secRow.appendChild(c);
  });

  // ---- chip handlers ----
  document.addEventListener("click",e=>{
    const c=e.target.closest(".chip"); if(!c) return;
    if(c.dataset.type){ setGroup(c,"type"); state.type=c.dataset.type; }
    else if(c.dataset.scope){ setGroup(c,"scope"); state.scope=c.dataset.scope; }
    else if(c.dataset.order){ setGroup(c,"order"); state.order=c.dataset.order; }
    else if(c.dataset.optshuffle!==undefined){
      state.optshuffle=!state.optshuffle;
      c.classList.toggle("on",state.optshuffle);
      c.textContent="選項打亂："+(state.optshuffle?"開":"關");
    }
    else if(c.dataset.sec){
      if(c.dataset.sec==="__all"){
        state.sec="__all";
        secRow.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.sec==="__all"));
      }else{
        secRow.querySelector('[data-sec="__all"]').classList.remove("on");
        c.classList.toggle("on");
        // collect selected
        const sel=[...secRow.querySelectorAll(".chip.on")].map(x=>x.dataset.sec).filter(x=>x!=="__all");
        state.sec = sel.length? sel : "__all";
        if(!sel.length) secRow.querySelector('[data-sec="__all"]').classList.add("on");
      }
    }
  });
  function setGroup(chip,attr){
    chip.parentElement.querySelectorAll(".chip[data-"+attr+"]").forEach(x=>x.classList.remove("on"));
    chip.classList.add("on");
  }

  // ---- start ----
  $("#btnStart").addEventListener("click",start);
  $("#btnResetStats").addEventListener("click",()=>{
    if(!confirm("確定清除所有作答紀錄（含錯題、標記、統計）？")) return;
    store={wrong:{},star:{},stat:{done:0,ok:0,no:0}}; save(); renderStats();
    alert("已清除。");
  });

  function pickList(){
    let arr=QUESTIONS.slice();
    if(state.type!=="all") arr=arr.filter(q=>q.type===state.type);
    if(state.sec!=="__all") arr=arr.filter(q=>state.sec.includes(q.sec));
    if(state.scope==="wrong") arr=arr.filter(q=>store.wrong[q.id]);
    if(state.scope==="star")  arr=arr.filter(q=>store.star[q.id]);
    if(state.order==="shuffle") shuffle(arr);
    return arr;
  }
  function start(){
    const arr=pickList();
    if(!arr.length){ alert("此範圍沒有題目，請調整設定。"); return; }
    state.list=arr; state.idx=0; state.answered={};
    // prepare display options per question (shuffle once per session)
    arr.forEach(q=>{ q._disp = dispOpts(q); q._done=false; q._sel=[]; });
    $("#setup").style.display="none";
    $("#quiz").style.display="block";
    renderQ();
    window.scrollTo({top:0,behavior:"smooth"});
  }
  function dispOpts(q){
    let normal=q.opts.filter(o=>!o.pin);
    let pinned=q.opts.filter(o=>o.pin);
    if(state.optshuffle) shuffle(normal);
    return normal.concat(pinned);
  }

  // ---- render current question ----
  function renderQ(){
    const q=state.list[state.idx];
    const card=$("#qcard");
    const isMulti=q.type==="multi";
    const starOn=store.star[q.id]?"on":"";
    let html="";
    html+='<div class="qhead"><div class="qmeta">'
      +'<span class="qtag '+q.type+'">'+(isMulti?'複選':'單選')+'</span>'
      +'<span class="qtag sec">'+q.sec+'</span>'
      +'第 '+(state.idx+1)+' / '+state.list.length+' 題'
      +'</div><span class="star '+starOn+'" id="star" title="標記待複習 (S)">★</span></div>';
    html+='<div class="qstem"><span class="num">'+niceId(q.id)+'</span>'+esc(q.q)
      + (isMulti?' <span style="font-size:13px;color:var(--red)">（複選）</span>':'') +'</div>';
    html+='<div id="opts">';
    q._disp.forEach((o,i)=>{
      html+='<div class="opt '+(isMulti?'multi':'')+'" data-k="'+o.k+'">'
        +'<div class="mk">'+(i+1)+'</div><div class="ot">'+esc(o.t)+'</div></div>';
    });
    html+='</div>';
    html+='<div class="actions">'
      +'<button class="btn ghost" id="btnPrev">← 上一題</button>'
      +'<button class="btn" id="btnSubmit">送出作答</button>'
      +'<span class="nav-spacer"></span>'
      +'<button class="btn gold" id="btnNext">下一題 →</button>'
      +'</div>';
    html+='<div class="explain" id="explain"><div class="bar"><span id="exres"></span>'
      +'<span id="exans" class="hide-sm" style="font-size:13px;font-weight:700"></span></div>'
      +'<div class="body"><div style="margin-bottom:7px"><span class="ans" id="exans2"></span></div>'
      +'<div><span class="lead">解說</span><span id="extext"></span></div></div></div>';
    card.innerHTML=html;

    // restore prior answer if any
    if(q._done){ lockAndShow(q); }
    else {
      $("#opts").querySelectorAll(".opt").forEach(op=>{
        op.addEventListener("click",()=>toggleSel(q,op));
      });
    }
    $("#btnSubmit").addEventListener("click",()=>submit(q));
    $("#btnPrev").addEventListener("click",()=>go(-1));
    $("#btnNext").addEventListener("click",()=>go(1));
    $("#star").addEventListener("click",()=>toggleStar(q));
    updatePBar();
    $("#btnPrev").disabled = state.idx===0;
  }
  function niceId(id){ return id.replace('S','單').replace('M','複'); }

  function toggleSel(q,op){
    if(q._done) return;
    const k=op.dataset.k;
    if(q.type==="single"){
      q._sel=[k];
      $("#opts").querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x.dataset.k===k));
    }else{
      const i=q._sel.indexOf(k);
      if(i>=0){ q._sel.splice(i,1); op.classList.remove("sel"); }
      else { q._sel.push(k); op.classList.add("sel"); }
    }
  }
  function submit(q){
    if(q._done){ go(1); return; }
    if(!q._sel.length){ alert("請先選擇答案。"); return; }
    q._done=true;
    const correct = same(q._sel,q.ans);
    // stats (count once per id)
    if(!state.answered[q.id]){
      state.answered[q.id]=true;
      store.stat.done++;
      if(correct){ store.stat.ok++; delete store.wrong[q.id]; }
      else { store.stat.no++; store.wrong[q.id]=true; }
      save(); renderStats();
    }
    lockAndShow(q);
  }
  function lockAndShow(q){
    const correct=same(q._sel,q.ans);
    $("#opts").querySelectorAll(".opt").forEach(op=>{
      op.classList.add("locked");
      const k=op.dataset.k;
      const isAns=q.ans.includes(k), isSel=q._sel.includes(k);
      op.classList.remove("sel");
      if(isAns) op.classList.add("correct");
      else if(isSel) op.classList.add("wrong");
    });
    const ex=$("#explain"); ex.classList.add("show");
    ex.classList.toggle("ok",correct); ex.classList.toggle("no",!correct);
    $("#exres").textContent = correct? "✓ 答對了" : "✗ 答錯了";
    const ansStr="正解："+q.ans.join("、");
    $("#exans").textContent=ansStr;
    $("#exans2").textContent=ansStr + (q.type==="multi"?"（複選需全對）":"");
    $("#extext").textContent=q.exp;
    // turn submit into "next"
    const bs=$("#btnSubmit"); bs.textContent="已作答"; bs.disabled=true; bs.classList.add("ghost");
  }
  function go(d){
    const n=state.idx+d;
    if(n<0) return;
    if(n>=state.list.length){ finish(); return; }
    state.idx=n; renderQ(); window.scrollTo({top:0,behavior:"smooth"});
  }
  function toggleStar(q){
    if(store.star[q.id]) delete store.star[q.id]; else store.star[q.id]=true;
    save();
    $("#star").classList.toggle("on",!!store.star[q.id]);
  }
  function finish(){
    const total=state.list.length;
    let done=0,ok=0;
    state.list.forEach(q=>{ if(q._done){done++; if(same(q._sel,q.ans))ok++;} });
    const rate= done? Math.round(ok/done*100):0;
    $("#quiz").querySelector("#qcard").innerHTML=
      '<div class="done"><h3>本回合完成 🎉</h3>'
      +'<div class="big">'+rate+'%</div>'
      +'<p>本回合作答 '+done+' 題，答對 '+ok+' 題，答錯 '+(done-ok)+' 題。</p>'
      +'<div class="startbar" style="justify-content:center">'
      +'<button class="btn gold" id="again">再練一回（重新洗題）</button>'
      +'<button class="btn red" id="wrongOnly" '+(Object.keys(store.wrong).length?'':'disabled')+'>只練錯題</button>'
      +'<button class="btn ghost" id="back">回設定</button></div></div>';
    $("#again").addEventListener("click",()=>{ start(); });
    $("#back").addEventListener("click",()=>{ $("#quiz").style.display="none"; $("#setup").style.display="block"; window.scrollTo({top:0,behavior:"smooth"}); });
    const wo=$("#wrongOnly"); if(wo) wo.addEventListener("click",()=>{
      // switch scope to wrong
      state.scope="wrong";
      document.querySelectorAll('[data-scope]').forEach(x=>x.classList.toggle("on",x.dataset.scope==="wrong"));
      start();
    });
    $("#pbar").style.width="100%";
  }

  function updatePBar(){ $("#pbar").style.width = ((state.idx)/state.list.length*100)+"%"; }
  function renderStats(){
    $("#st-done").textContent=store.stat.done;
    $("#st-ok").textContent=store.stat.ok;
    $("#st-no").textContent=store.stat.no;
    $("#st-rate").textContent= store.stat.done? Math.round(store.stat.ok/store.stat.done*100)+"%":"—";
    $("#st-pos").textContent = state.list.length? (state.idx+1)+"/"+state.list.length : "0/0";
  }

  // ---- keyboard ----
  document.addEventListener("keydown",e=>{
    if($("#quiz").style.display==="none") return;
    const q=state.list[state.idx]; if(!q) return;
    if(e.key>="1" && e.key<="5"){
      const i=+e.key-1; const op=$("#opts")&&$("#opts").querySelectorAll(".opt")[i];
      if(op && !q._done){ toggleSel(q,op); }
    } else if(e.key==="Enter"){ e.preventDefault();
      if(q._done) go(1); else submit(q);
    } else if(e.key==="ArrowRight"){ go(1); }
    else if(e.key==="ArrowLeft"){ go(-1); }
    else if(e.key==="s"||e.key==="S"){ toggleStar(q); }
  });

  // ---- utils ----
  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function same(a,b){ if(a.length!==b.length) return false; const s=[...a].sort().join(""); const t=[...b].sort().join(""); return s===t; }
  function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

  renderStats();
})();
</script>
</body>
